[project]
name = "retainer-kit"
version = "1.0.0"
description = "The monthly e-commerce report a freelance analyst delivers on retainer, templated per client from a Shopify orders export."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
retainer = "retainer_kit.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retainer_kit"]
